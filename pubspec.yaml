name: barlytics_frontend
description: Frontend Flutter empresarial multiplataforma para BarLytics / BarApp.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  equatable: ^2.0.5
  collection: ^1.18.0
  crypto: ^3.0.7
  file_picker: ^8.3.7
  pdf: ^3.11.1
  url_launcher: ^6.3.1
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  openid_client: ^0.4.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
