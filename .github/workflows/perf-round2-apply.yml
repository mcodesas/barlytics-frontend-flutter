name: Apply performance round 2 patch

on:
  push:
    branches:
      - perf/optimizar-tiempos-respuesta-round2
    paths:
      - .github/workflows/perf-round2-apply.yml
      - tool/apply_perf_round2.py

permissions:
  contents: write

jobs:
  patch-large-mesero-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/optimizar-tiempos-respuesta-round2
          fetch-depth: 0

      - name: Apply targeted performance changes
        run: python tool/apply_perf_round2.py

      - name: Commit generated patch
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/mesero/presentation/pages/mesero_page.dart
          git commit -m "perf(mesero): mostrar mesas antes de datos secundarios"
          git push origin HEAD:perf/optimizar-tiempos-respuesta-round2
