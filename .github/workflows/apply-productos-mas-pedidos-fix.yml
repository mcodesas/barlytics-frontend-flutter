name: Apply productos mas pedidos fix

on:
  push:
    branches: ["fix/productos-mas-pedidos-hoy"]

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/productos-mas-pedidos-hoy

      - name: Aplicar ajuste
        run: python3 .github/scripts/apply_productos_fix.py

      - name: Commit del ajuste
        run: |
          if git diff --quiet; then
            echo "Sin cambios pendientes"
            exit 0
          fi
          git config user.name "barlytics-bot"
          git config user.email "barlytics-bot@users.noreply.github.com"
          git add lib/features/mesero/presentation/pages/mesero_page.dart
          git commit -m "fix: evitar cargar historial para ordenar productos"
          git push origin HEAD:fix/productos-mas-pedidos-hoy
