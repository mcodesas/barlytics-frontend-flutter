name: Frontend CI

on:
  pull_request:
    branches: [main, stagen, develop]
  push:
    branches: [develop]

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Analisis y pruebas Flutter
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  windows-installer:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Preparar dependencias
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Compilar Windows release
        shell: pwsh
        run: |
          $versionLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)\+([0-9]+)'
          if (-not $versionLine) { throw 'No fue posible obtener version y build desde pubspec.yaml' }
          $version = $versionLine.Matches[0].Groups[1].Value
          $build = $versionLine.Matches[0].Groups[2].Value
          flutter build windows --release `
            --dart-define=ENV=prod `
            --dart-define=BARLYTICS_APP_VERSION=$version `
            --dart-define=BARLYTICS_APP_BUILD=$build

      - name: Generar instalador EXE
        shell: pwsh
        run: |
          $versionLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)'
          if (-not $versionLine) { throw 'No fue posible obtener la version desde pubspec.yaml' }
          $version = $versionLine.Matches[0].Groups[1].Value

          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "No se encontro ISCC.exe en $iscc" }

          $buildDir = (Resolve-Path 'build\windows\x64\runner\Release').Path
          & $iscc "/DMyAppVersion=$version" "/DBuildDir=$buildDir" "deploy\windows\barlytics.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publicar instalador Windows como artefacto del PR
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: barlytics-windows-installer
          path: build/installers/windows/BarLytics-Windows-Setup.exe
          if-no-files-found: error
          retention-days: 1

  linux-installer:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependencias Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            dpkg-dev

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Preparar plataforma Linux
        run: |
          flutter config --enable-linux-desktop
          if [ ! -d linux ]; then
            flutter create --platforms=linux --project-name=barlytics_frontend .
          fi
          flutter pub get

      - name: Compilar Linux release
        run: |
          VERSION="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+)\+([0-9]+).*/\1/p' pubspec.yaml | head -n1)"
          BUILD="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+)\+([0-9]+).*/\2/p' pubspec.yaml | head -n1)"
          test -n "$VERSION"
          test -n "$BUILD"
          flutter build linux --release \
            --dart-define=ENV=prod \
            --dart-define=BARLYTICS_APP_VERSION="$VERSION" \
            --dart-define=BARLYTICS_APP_BUILD="$BUILD"

      - name: Generar paquete DEB
        run: |
          VERSION="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml | head -n1)"
          test -n "$VERSION"
          bash deploy/linux/build-deb.sh "$VERSION"

      - name: Publicar instalador Linux como artefacto del PR
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: barlytics-linux-installer
          path: build/installers/linux/barlytics-linux-amd64.deb
          if-no-files-found: error
          retention-days: 1

  macos-installer:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Preparar dependencias
        run: |
          flutter config --enable-macos-desktop
          flutter pub get

      - name: Compilar macOS release
        run: |
          VERSION="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+)\+([0-9]+).*/\1/p' pubspec.yaml | head -n1)"
          BUILD="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+)\+([0-9]+).*/\2/p' pubspec.yaml | head -n1)"
          test -n "$VERSION"
          test -n "$BUILD"
          flutter build macos --release \
            --dart-define=ENV=prod \
            --dart-define=BARLYTICS_APP_VERSION="$VERSION" \
            --dart-define=BARLYTICS_APP_BUILD="$BUILD"

      - name: Generar instalador DMG
        run: bash deploy/macos/build-dmg.sh

      - name: Publicar instalador macOS como artefacto del PR
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: barlytics-macos-installer
          path: build/installers/macos/BarLytics-macOS.dmg
          if-no-files-found: error
          retention-days: 1

  android-bundle:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Preparar dependencias
        run: flutter pub get

      - name: Restaurar firma Android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Falta el secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Falta el secret ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Falta el secret ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Falta el secret ANDROID_KEY_PASSWORD"; exit 1; }

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Compilar Android App Bundle
        run: |
          VERSION="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml | head -n1)"
          BUILD="$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))"
          test -n "$VERSION"
          flutter build appbundle --release \
            --build-name="$VERSION" \
            --build-number="$BUILD" \
            --dart-define=ENV=prod \
            --dart-define=BARLYTICS_APP_VERSION="$VERSION" \
            --dart-define=BARLYTICS_APP_BUILD="$BUILD"


      - name: Restaurar credenciales Google Play
        if: github.event.pull_request.draft == false
        env:
          PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          test -n "$PLAY_SERVICE_ACCOUNT_JSON_BASE64" || { echo "Falta el secret PLAY_SERVICE_ACCOUNT_JSON_BASE64"; exit 1; }
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON_BASE64" | base64 --decode > "$RUNNER_TEMP/play-service-account.json"
          jq -e '.type == "service_account" and (.client_email | length > 0) and (.private_key | length > 0)' "$RUNNER_TEMP/play-service-account.json" > /dev/null

      - name: Instalar Fastlane
        if: github.event.pull_request.draft == false
        run: sudo gem install fastlane --no-document

      - name: Publicar en Google Play Internal Testing
        if: github.event.pull_request.draft == false
        run: |
          fastlane supply \
            --json_key "$RUNNER_TEMP/play-service-account.json" \
            --package_name "com.mcode.barlytics" \
            --aab build/app/outputs/bundle/release/app-release.aab \
            --track internal \
            --release_status completed \
            --skip_upload_metadata true \
            --skip_upload_images true \
            --skip_upload_screenshots true \
            --skip_upload_changelogs true
