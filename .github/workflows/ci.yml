name: Frontend CI (manual)

# No hay eventos push ni pull_request: no se consumen minutos en PR o
# ramas de trabajo. En main los builds y despliegues de producción corren
# en deploy-production.yml, deploy-macos.yml e ios-testflight.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  test:
    name: Analizar y probar Flutter (manual)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Analisis y pruebas Flutter
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
