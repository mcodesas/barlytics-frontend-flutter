name: iOS - TestFlight

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Notas de esta build para TestFlight"
        required: false
        default: "Nueva versión de BarLytics con mejoras y correcciones."
  push:
    branches:
      - main
    # Solo integraciones en main despliegan automáticamente TestFlight.
    # Los tags y PR ya no disparan ejecuciones automáticas.
    paths-ignore:
      - '.github/workflows/**'
      - 'docs/**'
      - 'README*'
      - 'deploy/macos/**'

permissions:
  contents: read

concurrency:
  group: barlytics-ios-testflight
  cancel-in-progress: true

jobs:
  testflight:
    name: Compilar IPA y publicar en TestFlight
    runs-on: xcode-27
    # Las credenciales VPS están asociadas al environment production.
    # Sin él, la subida a Apple funciona pero latest.json no se actualiza.
    environment: production
    timeout-minutes: 60

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Verificar Xcode 27, SDK de iOS y pantalla de inicio
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "SDK para compilar BarLytics: iOS $SDK_VERSION"
          if [[ "${SDK_VERSION%%.*}" -lt 27 ]]; then
            echo "::error::ITMS-90725: se requiere el SDK de iOS 27 o posterior."
            exit 1
          fi
          # iOS 27 exige una pantalla de inicio declarada en Info.plist.
          test "$(plutil -extract UILaunchStoryboardName raw ios/Runner/Info.plist)" = "LaunchScreen"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Configurar Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Validar secretos de Apple
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          test -n "$APP_STORE_CONNECT_KEY_ID" || { echo "Falta APP_STORE_CONNECT_KEY_ID"; exit 1; }
          test -n "$APP_STORE_CONNECT_ISSUER_ID" || { echo "Falta APP_STORE_CONNECT_ISSUER_ID"; exit 1; }
          test -n "$APP_STORE_CONNECT_KEY_BASE64" || { echo "Falta APP_STORE_CONNECT_KEY_BASE64"; exit 1; }
          test -n "$APPLE_TEAM_ID" || { echo "Falta APPLE_TEAM_ID"; exit 1; }
          test -n "$MATCH_GIT_TOKEN" || { echo "Falta MATCH_GIT_TOKEN"; exit 1; }
          test -n "$MATCH_PASSWORD" || { echo "Falta MATCH_PASSWORD"; exit 1; }

      - name: Preparar dependencias Flutter
        run: flutter pub get

      - name: Instalar dependencias Ruby y CocoaPods
        working-directory: ios
        run: |
          bundle install
          RUBY_BINDIR="$(ruby -e 'require "rbconfig"; print RbConfig::CONFIG["bindir"]')"
          GEM_BINDIR="$(ruby -e 'print Gem.bindir')"
          echo "$RUBY_BINDIR" >> "$GITHUB_PATH"
          echo "$GEM_BINDIR" >> "$GITHUB_PATH"
          "$GEM_BINDIR/pod" --version

      - name: Instalar Pods
        working-directory: ios
        run: bundle exec pod install --repo-update

      - name: Preparar versión y número de build
        shell: bash
        run: |
          VERSION="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml | head -n1)"
          BUILD_NUMBER="$(date -u +%Y%m%d%H%M)${GITHUB_RUN_ATTEMPT}"

          test -n "$VERSION"
          test -n "$BUILD_NUMBER"

          echo "IOS_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IOS_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "BarLytics iOS: version=$VERSION build=$BUILD_NUMBER"

      - name: Compilar y publicar en TestFlight
        working-directory: ios
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_GIT_URL: "https://github.com/mcodesas/barlytics-ios-certificates.git"
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          IOS_CHANGELOG: ${{ github.event.inputs.release_notes || 'Nueva versión de BarLytics con mejoras y correcciones.' }}
        run: bundle exec fastlane ios testflight

      - name: Publicar versión disponible en manifiesto TestFlight
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          IOS_UPDATE_URL: ${{ vars.BARLYTICS_IOS_TESTFLIGHT_URL || 'https://apps.apple.com/app/testflight/id899247664' }}
        shell: bash
        run: |
          # Missing VPS credentials must not mark a successful Apple upload as failed.
          # The update manifest is optional and is never silently reported as published.
          if [[ -z "${VPS_HOST:-}" || -z "${VPS_USER:-}" ||
                -z "${VPS_SSH_PRIVATE_KEY:-}" || -z "${VPS_KNOWN_HOSTS:-}" ]]; then
            echo "::warning::IPA publicado en TestFlight, pero se omitió latest.json: faltan secretos VPS_HOST, VPS_USER, VPS_SSH_PRIVATE_KEY o VPS_KNOWN_HOSTS."
            exit 0
          fi
          bash deploy/update/publish-ios-vps.sh

      - name: Subir IPA como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barlytics-ios-ipa
          path: build/ios/ipa/BarLytics.ipa
          if-no-files-found: ignore
          retention-days: 1
