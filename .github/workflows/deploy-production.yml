name: Frontend Production

on:
  push:
    branches: [main]
    # Un cambio dedicado a macOS no vuelve a desplegar Android, Windows, Linux ni web.
    paths-ignore:
      - '.github/workflows/**'
      - 'docs/**'
      - 'README*'
      - 'deploy/macos/**'
  workflow_dispatch:

concurrency:
  group: barlytics-frontend-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  verify:
    name: QA - comprobación de actualizaciones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Preparar dependencias
        run: flutter pub get
      - name: Probar detección de nuevas versiones
        run: |
          flutter test test/core/update/app_update_model_test.dart
          flutter analyze lib/core/update
          python3 -m unittest discover -s deploy/update -p 'test_*.py'

  android:
    needs: verify
    name: Android - Google Play Internal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Preparar dependencias
        run: flutter pub get

      - name: Restaurar firma Android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Compilar Android App Bundle
        run: |
          VERSION="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml | head -n1)"
          BUILD="$(bash deploy/update/release-build.sh)"
          if [ "$BUILD" -le 2000000692 ] || [ "$BUILD" -gt 2100000000 ]; then
            echo "ERROR: versionCode Android fuera de rango seguro: $BUILD"
            exit 1
          fi
          echo "Android versionCode de producción: $BUILD"
          flutter build appbundle --release --build-name="$VERSION" --build-number="$BUILD" --dart-define=ENV=prod --dart-define=BARLYTICS_APP_VERSION="$VERSION" --dart-define=BARLYTICS_APP_BUILD="$BUILD"

      - name: Restaurar credenciales Google Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          test -n "$PLAY_SERVICE_ACCOUNT_JSON_BASE64"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON_BASE64" | base64 --decode > "$RUNNER_TEMP/play-service-account.json"

      - name: Instalar Fastlane
        run: sudo gem install fastlane --no-document

      - name: Publicar en Google Play Internal Testing
        run: |
          fastlane supply --json_key "$RUNNER_TEMP/play-service-account.json" --package_name "com.mcode.barlytics" --aab build/app/outputs/bundle/release/app-release.aab --track internal --release_status completed --skip_upload_metadata true --skip_upload_images true --skip_upload_screenshots true --skip_upload_changelogs true

  windows:
    needs: verify
    name: Windows - instalador
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Compilar Windows
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          $versionLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)'
          $version = $versionLine.Matches[0].Groups[1].Value
          $epoch = [long](git show -s --format=%ct HEAD)
          $build = [long](2002000000 + [math]::Floor(($epoch - 1767225600) / 2))
          if ($build -le 2000000692 -or $build -ge 2100000000) { throw 'Build Windows fuera de rango' }
          flutter build windows --release --build-name="$version" --build-number="$build" --dart-define=ENV=prod --dart-define=BARLYTICS_APP_VERSION="$version" --dart-define=BARLYTICS_APP_BUILD="$build"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $buildDir = (Resolve-Path 'build\windows\x64\runner\Release').Path
          & $iscc "/DMyAppVersion=$version" "/DBuildDir=$buildDir" "deploy\windows\barlytics.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: barlytics-windows-installer
          path: build/installers/windows/BarLytics-Windows-Setup.exe
          retention-days: 1

  linux:
    needs: verify
    name: Linux - instalador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            dpkg-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Compilar Linux
        run: |
          flutter config --enable-linux-desktop
          flutter create --platforms=linux .
          flutter pub get
          VERSION="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml | head -n1)"
          BUILD="$(bash deploy/update/release-build.sh)"
          flutter build linux --release --build-name="$VERSION" --build-number="$BUILD" --dart-define=ENV=prod --dart-define=BARLYTICS_APP_VERSION="$VERSION" --dart-define=BARLYTICS_APP_BUILD="$BUILD"
          bash deploy/linux/build-deb.sh "$VERSION+$BUILD"
      - uses: actions/upload-artifact@v4
        with:
          name: barlytics-linux-installer
          path: build/installers/linux/barlytics-linux-amd64.deb
          retention-days: 1

  image:
    # Esperar a la publicación efectiva en Google Play antes de anunciar el build.
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    outputs:
      tag: sha-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar instalador Windows generado en este workflow
        uses: actions/download-artifact@v4
        with:
          name: barlytics-windows-installer
          path: web/downloads

      - name: Descargar instalador Linux generado en este workflow
        uses: actions/download-artifact@v4
        with:
          name: barlytics-linux-installer
          path: web/downloads

      - name: Conservar manifiesto y DMG publicados
        run: |
          mkdir -p web/downloads
          curl --fail --location --retry 3 -o /tmp/barlytics-previous-latest.json \
            https://www.barlytics.com.co/downloads/latest.json || rm -f /tmp/barlytics-previous-latest.json
          if curl --fail --location --retry 2 -o web/downloads/BarLytics-macOS.dmg \
            https://www.barlytics.com.co/downloads/BarLytics-macOS.dmg; then
            echo "Conservando DMG publicado."
          else
            rm -f web/downloads/BarLytics-macOS.dmg
          fi

      - name: Generar manifiesto con builds publicados reales
        env:
          BARLYTICS_UPDATE_MANDATORY: ${{ vars.BARLYTICS_UPDATE_MANDATORY || 'false' }}
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml | head -n1)"
          BUILD="$(bash deploy/update/release-build.sh)"
          test -n "$VERSION"
          test -s web/downloads/BarLytics-Windows-Setup.exe
          test -s web/downloads/barlytics-linux-amd64.deb
          WINDOWS_SHA="$(sha256sum web/downloads/BarLytics-Windows-Setup.exe | awk '{print $1}')"
          LINUX_SHA="$(sha256sum web/downloads/barlytics-linux-amd64.deb | awk '{print $1}')"
          MACOS_SHA=""
          if [ -s web/downloads/BarLytics-macOS.dmg ]; then
            MACOS_SHA="$(sha256sum web/downloads/BarLytics-macOS.dmg | awk '{print $1}')"
          fi
          python3 deploy/update/generate-manifest.py \
            --version "$VERSION" --build "$BUILD" \
            --windows-sha "$WINDOWS_SHA" --linux-sha "$LINUX_SHA" \
            --macos-sha "$MACOS_SHA" \
            --previous /tmp/barlytics-previous-latest.json \
            --output web/downloads/latest.json
          python3 - <<'PY'
          import json
          m = json.load(open('web/downloads/latest.json', encoding='utf-8'))
          p = m['platforms']
          assert all(p[k]['enabled'] and p[k]['build'] == m['build']
                     for k in ('windows', 'linux', 'android'))
          assert p['android']['url'].startswith('https://play.google.com/')
          if p['macos']['enabled']:
              assert len(p['macos']['sha256']) == 64
          print('Release verificado', m['version'], m['build'],
                {k: v.get('build') for k, v in p.items()})
          PY

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y publicar frontend web
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Preparar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Desplegar y verificar frontend en VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes \
            -i ~/.ssh/id_ed25519 \
            "$VPS_USER@$VPS_HOST" \
            "bash -s -- sha-${GITHUB_SHA}" <<'REMOTE'
          set -euo pipefail
          cd /opt/barlytics

          TAG="$1"
          COMPOSE_FILE="docker-compose.prod.yml"

          ./deploy.sh frontend "$TAG"

          container_id="$(docker compose -f "$COMPOSE_FILE" ps -q frontend)"
          if [ -z "$container_id" ]; then
            echo "ERROR: el contenedor frontend no fue creado."
            docker compose -f "$COMPOSE_FILE" ps
            exit 1
          fi

          echo "Esperando que el frontend quede healthy..."
          for intento in $(seq 1 30); do
            status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id" 2>/dev/null || true)"
            echo "Intento ${intento}/30: estado=${status:-desconocido}"

            if [ "$status" = "healthy" ]; then
              docker exec "$container_id" wget -q -O /dev/null http://127.0.0.1/healthz
              docker exec "$container_id" test -s /usr/share/nginx/html/downloads/BarLytics-Windows-Setup.exe
              docker exec "$container_id" test -s /usr/share/nginx/html/downloads/barlytics-linux-amd64.deb
              docker exec "$container_id" test -s /usr/share/nginx/html/downloads/latest.json
              # El pipeline TestFlight es independiente. Si publicó una build
              # mientras se construía el frontend web, restaurar los metadatos
              # persistidos antes de terminar el despliegue.
              ios_release="/opt/barlytics/downloads/ios/last-release.json"
              if [ -s "$ios_release" ]; then
                work="$(mktemp -d)"
                docker cp "$container_id:/usr/share/nginx/html/downloads/latest.json" "$work/latest.json"
                python3 - "$work/latest.json" "$ios_release" <<'PY'
          import json,sys
          from pathlib import Path
          file,source=map(Path,sys.argv[1:])
          data=json.loads(file.read_text(encoding="utf-8"))
          published=json.loads(source.read_text(encoding="utf-8"))
          current=data.setdefault("platforms",{}).get("ios",{})
          if (published.get("enabled") is True and
              (current.get("version") != published.get("version") or
               int(current.get("build",0)) < int(published.get("build",0)))):
              data["platforms"]["ios"]=published
              file.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
                docker cp "$work/latest.json" "$container_id:/usr/share/nginx/html/downloads/latest.json.new"
                docker exec "$container_id" mv -f \
                  /usr/share/nginx/html/downloads/latest.json.new \
                  /usr/share/nginx/html/downloads/latest.json
                rm -rf "$work"
              fi
              echo "Frontend web desplegado correctamente."
              exit 0
            fi

            if [ "$status" = "unhealthy" ] || [ "$status" = "exited" ] || [ "$status" = "dead" ]; then
              docker compose -f "$COMPOSE_FILE" logs --tail=200 frontend || true
              exit 1
            fi
            sleep 5
          done

          docker compose -f "$COMPOSE_FILE" logs --tail=200 frontend || true
          exit 1
          REMOTE
