name: Apply POS cached image fallback

on:
  push:
    branches:
      - perf/optimizar-tiempos-respuesta-round2
    paths:
      - .github/workflows/perf-round2-sale-images.yml
      - tool/apply_sale_image_cache_fallback.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/optimizar-tiempos-respuesta-round2
          fetch-depth: 0
      - run: python tool/apply_sale_image_cache_fallback.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/mesero/presentation/pages/mesero_page.dart
          git commit -m "perf(mesero): reutilizar imagenes del catalogo cacheado"
          git push origin HEAD:perf/optimizar-tiempos-respuesta-round2
