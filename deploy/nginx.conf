server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    ssi on;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/(software-para-bares|funcionalidades|nosotros|planes|descargas|contacto|preguntas-frecuentes|documentacion|privacidad|terminos)$ {
        return 301 $scheme://$host$uri/;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /robots.txt {
        default_type text/plain;
        expires 10m;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        expires 10m;
        try_files $uri =404;
    }

    # El logotipo y otros recursos de marca no cambian en cada navegación.
    # Cachearlos un día evita descargar repetidamente el PNG de 481 KB.
    # La portada HTML continúa siempre sin caché y Flutter publica versiones
    # nuevas de la aplicación de forma independiente.
    location ^~ /branding/ {
        expires 1d;
        try_files $uri =404;
    }

    location = /downloads/latest.json {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location /downloads/ {
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=300" always;
        add_header Content-Disposition "attachment" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    location ~* \.(?:js|wasm|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }
}
