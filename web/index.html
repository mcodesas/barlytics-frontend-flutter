<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BarLytics: plataforma para bares y gastrobares con ventas, mesas, cobros, inventario, productos, caja, reportes, roles y multi-sucursal.">
  <meta name="keywords" content="BarLytics, software para bares, POS bares, gastrobar, inventario, ventas, mesas, caja, reportes">
  <meta name="robots" content="index,follow">
  <meta property="og:title" content="BarLytics | Gestión para bares y gastrobares">
  <meta property="og:description" content="Prueba una demo interactiva de BarLytics y conoce cómo funciona en escritorio, tablet y celular.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#061723">
  <title>BarLytics | Gestión para bares y gastrobares</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #061723;
      overflow: hidden;
    }

    #barlytics-loader {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 35%, rgba(33, 230, 190, 0.12), transparent 34%),
        linear-gradient(145deg, #061723 0%, #081d2a 55%, #061723 100%);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: opacity 260ms ease, visibility 260ms ease;
    }

    #barlytics-loader.barlytics-loader--hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .barlytics-loader__content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 32px;
    }

    .barlytics-loader__brand {
      color: #f8fafc;
      font-size: clamp(32px, 6vw, 48px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -1.8px;
    }

    .barlytics-loader__brand span {
      color: #21e6be;
    }

    .barlytics-loader__subtitle {
      margin-top: 12px;
      color: #9fb7c3;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .barlytics-loader__spinner {
      width: 38px;
      height: 38px;
      margin-top: 30px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #21e6be;
      animation: barlytics-spin 760ms linear infinite;
    }

    .barlytics-loader__status {
      margin-top: 14px;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 600;
    }

    @keyframes barlytics-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #barlytics-loader {
        transition: none;
      }

      .barlytics-loader__spinner {
        animation-duration: 1.8s;
      }
    }
  </style>
</head>
<body>
  <!--
    Este loader existe en HTML, no en Flutter. Por eso aparece inmediatamente,
    incluso mientras se descargan main.dart.js, CanvasKit/Wasm y se ejecuta
    bootstrap() de Dart.
  -->
  <div id="barlytics-loader" role="status" aria-live="polite" aria-label="Cargando BarLytics">
    <div class="barlytics-loader__content">
      <div class="barlytics-loader__brand">Bar<span>Lytics</span></div>
      <div class="barlytics-loader__subtitle">Gestión inteligente para tu negocio</div>
      <div class="barlytics-loader__spinner" aria-hidden="true"></div>
      <div class="barlytics-loader__status">Iniciando BarLytics...</div>
    </div>
  </div>

  <noscript>BarLytics necesita JavaScript habilitado para funcionar.</noscript>

  <script>
    (() => {
      const loader = document.getElementById('barlytics-loader');
      let hidden = false;

      const hideLoader = () => {
        if (hidden || !loader) return;
        hidden = true;

        // Espera un ciclo de pintura para que el primer frame de Flutter quede
        // visible antes de retirar la capa HTML.
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            loader.classList.add('barlytics-loader--hidden');
            window.setTimeout(() => loader.remove(), 320);
          });
        });
      };

      // Flutter Web emite este evento cuando presenta su primer frame.
      window.addEventListener('flutter-first-frame', hideLoader, { once: true });
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
