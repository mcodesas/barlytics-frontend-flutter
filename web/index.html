<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BarLytics: plataforma para bares y gastrobares con ventas, mesas, cobros, inventario, productos, caja, reportes, roles y multi-sucursal.">
  <meta name="keywords" content="BarLytics, software para bares, POS bares, gastrobar, inventario, ventas, mesas, caja, reportes">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://www.barlytics.com.co/">
  <meta property="og:title" content="BarLytics | Gestión para bares y gastrobares">
  <meta property="og:description" content="Prueba una demo interactiva de BarLytics y conoce cómo funciona en escritorio, tablet y celular.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.barlytics.com.co/">
  <meta name="theme-color" content="#061723">
  <title>BarLytics | Gestión para bares y gastrobares</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #061723;
      overflow: hidden;
    }

    #barlytics-loader {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      box-sizing: border-box;
      background:
        radial-gradient(circle at 50% 42%, rgba(11, 217, 216, 0.16), transparent 36%),
        linear-gradient(145deg, #020817 0%, #061723 52%, #08283a 100%);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: opacity 260ms ease, visibility 260ms ease;
    }

    #barlytics-loader.barlytics-loader--hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .barlytics-loader__content {
      width: min(720px, 90vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .barlytics-loader__logo {
      display: block;
      width: min(640px, 86vw);
      max-height: 230px;
      object-fit: contain;
      object-position: center;
      filter: drop-shadow(0 16px 36px rgba(0, 226, 213, 0.10));
    }

    .barlytics-loader__spinner {
      width: 34px;
      height: 34px;
      margin-top: 28px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.10);
      border-top-color: #21e6be;
      animation: barlytics-spin 760ms linear infinite;
    }

    .barlytics-loader__status {
      margin-top: 12px;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0.02em;
    }

    @keyframes barlytics-spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 600px) {
      #barlytics-loader { padding: 20px; }
      .barlytics-loader__logo { width: min(520px, 92vw); }
      .barlytics-loader__spinner { margin-top: 20px; }
    }

    @media (prefers-color-scheme: light) {
      html, body { background: #f6f9fc; }
      #barlytics-loader {
        background:
          radial-gradient(circle at 50% 42%, rgba(11, 217, 216, 0.10), transparent 38%),
          linear-gradient(145deg, #ffffff 0%, #f6f9fc 58%, #edf5f8 100%);
      }
      .barlytics-loader__status { color: #475569; }
      .barlytics-loader__spinner { border-color: rgba(2, 24, 48, 0.10); border-top-color: #06b6d4; }
    }

    @media (prefers-reduced-motion: reduce) {
      #barlytics-loader { transition: none; }
      .barlytics-loader__spinner { animation-duration: 1.8s; }
    }
  </style>
</head>
<body>
  <div id="barlytics-loader" role="status" aria-live="polite" aria-label="Cargando BarLytics">
    <div class="barlytics-loader__content">
      <picture>
        <source media="(prefers-color-scheme: light)" srcset="branding/barlytics-logo-dark.png">
        <img class="barlytics-loader__logo" src="branding/barlytics-logo-light.png" alt="BarLytics - Gestión inteligente para tu negocio">
      </picture>
      <div class="barlytics-loader__spinner" aria-hidden="true"></div>
      <div class="barlytics-loader__status">Iniciando BarLytics...</div>
    </div>
  </div>

  <noscript>BarLytics necesita JavaScript habilitado para funcionar.</noscript>

  <script>
    (() => {
      const loader = document.getElementById('barlytics-loader');
      let hidden = false;
      const hideLoader = () => {
        if (hidden || !loader) return;
        hidden = true;
        requestAnimationFrame(() => requestAnimationFrame(() => {
          loader.classList.add('barlytics-loader--hidden');
          window.setTimeout(() => loader.remove(), 320);
        }));
      };
      window.addEventListener('flutter-first-frame', hideLoader, { once: true });
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
