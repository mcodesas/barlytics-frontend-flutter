  <style>
    :root { color-scheme: dark; background: #061723; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #061723 !important;
      color-scheme: dark;
      overflow: hidden;
      overscroll-behavior: none;
    }

    #barlytics-loader {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(28px + env(safe-area-inset-top)) 28px calc(28px + env(safe-area-inset-bottom));
      box-sizing: border-box;
      background:
        radial-gradient(circle at 50% 42%, rgba(11, 217, 216, 0.16), transparent 36%),
        linear-gradient(145deg, #020817 0%, #061723 52%, #08283a 100%);
      font-family: Roboto, sans-serif;
      transition: opacity 260ms ease, visibility 260ms ease;
    }

    #barlytics-loader.barlytics-loader--hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .barlytics-loader__content {
      width: min(720px, 90vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .barlytics-loader__logo {
      display: block;
      width: min(640px, 86vw);
      max-height: 230px;
      object-fit: contain;
      object-position: center;
      filter: drop-shadow(0 16px 36px rgba(0, 226, 213, 0.10));
    }

    .barlytics-loader__spinner {
      width: 34px;
      height: 34px;
      margin-top: 28px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.10);
      border-top-color: #21e6be;
      animation: barlytics-spin 760ms linear infinite;
    }

    .barlytics-loader__status {
      margin-top: 12px;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    @keyframes barlytics-spin { to { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      #barlytics-loader { padding-left: 20px; padding-right: 20px; }
      .barlytics-loader__logo { width: min(520px, 92vw); }
      .barlytics-loader__spinner { margin-top: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #barlytics-loader { transition: none; }
      .barlytics-loader__spinner { animation-duration: 1.8s; }
    }

      <div class="barlytics-loader__status">Iniciando BarLytics...</div>
    </div>
  </div>

  <noscript>
    <p>BarLytics necesita JavaScript habilitado para ejecutar la aplicación. Puedes consultar la información pública en <a href="/software-para-bares/">software para bares</a>, <a href="/funcionalidades/">funcionalidades</a>, <a href="/planes/">planes</a>, <a href="/descargas/">descargas</a>, <a href="/contacto/">contacto</a> y <a href="/preguntas-frecuentes/">preguntas frecuentes</a>.</p>
  </noscript>

  <script>
    (() => {
      const BARLYTICS_THEME = '#061723';
      document.documentElement.style.colorScheme = 'dark';
      document.body.style.backgroundColor = BARLYTICS_THEME;
      const theme = document.querySelector('meta[name="theme-color"]');
      if (theme) theme.setAttribute('content', BARLYTICS_THEME);

      const preventZoomKey = (event) => {
        if ((event.ctrlKey || event.metaKey) && ['+', '-', '=', '0'].includes(event.key)) {
          event.preventDefault();
        }
      };
      window.addEventListener('keydown', preventZoomKey, { passive: false });
      window.addEventListener('wheel', (event) => {
        if (event.ctrlKey || event.metaKey) event.preventDefault();
      }, { passive: false });
      ['gesturestart', 'gesturechange', 'gestureend'].forEach((name) => {
        document.addEventListener(name, (event) => event.preventDefault(), { passive: false });
      });

      const loader = document.getElementById('barlytics-loader');
      let hidden = false;
      const hideLoader = () => {
        if (hidden || !loader) return;
        hidden = true;
        requestAnimationFrame(() => requestAnimationFrame(() => {
          loader.classList.add('barlytics-loader--hidden');
          window.setTimeout(() => loader.remove(), 320);
        }));
      };
      window.addEventListener('flutter-first-frame', hideLoader, { once: true });
    })();
  </script>
